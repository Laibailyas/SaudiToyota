<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Dashboard | Saudi Toyota Championship</title>
  <link rel="stylesheet" href="/dashboard.css?v=3">
  <script src="/dashboard.js?v=3" defer></script>
  <script src="/dashboard-results.js?v=2" defer></script>
<style id="stc-category-brand-hover">
/* Explicit category colors overriding global nav hover. */
nav .dd .sub a[href$="/karting.html"]:hover,
nav .dd .sub a[href$="/karting.html"]:focus-visible,
nav .dd .sub a[href$="/karting.html"].on,
nav .dd .sub a[href="karting.html"]:hover,
nav .dd .sub a[href="karting.html"]:focus-visible,
nav .dd .sub a[href="karting.html"].on{color:#E8202E!important;background:#f4f4f4!important;}
nav .dd .sub a[href$="/autocross.html"]:hover,
nav .dd .sub a[href$="/autocross.html"]:focus-visible,
nav .dd .sub a[href$="/autocross.html"].on,
nav .dd .sub a[href="autocross.html"]:hover,
nav .dd .sub a[href="autocross.html"]:focus-visible,
nav .dd .sub a[href="autocross.html"].on{color:#00875A!important;background:#f4f4f4!important;}
nav .dd .sub a[href$="/time-attack.html"]:hover,
nav .dd .sub a[href$="/time-attack.html"]:focus-visible,
nav .dd .sub a[href$="/time-attack.html"].on,
nav .dd .sub a[href="time-attack.html"]:hover,
nav .dd .sub a[href="time-attack.html"]:focus-visible,
nav .dd .sub a[href="time-attack.html"].on{color:#E8202E!important;background:#f4f4f4!important;}
nav .dd .sub a[href$="/drift.html"]:hover,
nav .dd .sub a[href$="/drift.html"]:focus-visible,
nav .dd .sub a[href$="/drift.html"].on,
nav .dd .sub a[href="drift.html"]:hover,
nav .dd .sub a[href="drift.html"]:focus-visible,
nav .dd .sub a[href="drift.html"].on{color:#E8202E!important;background:#f4f4f4!important;}
nav .dd .sub a[href$="/hill-climb.html"]:hover,
nav .dd .sub a[href$="/hill-climb.html"]:focus-visible,
nav .dd .sub a[href$="/hill-climb.html"].on,
nav .dd .sub a[href="hill-climb.html"]:hover,
nav .dd .sub a[href="hill-climb.html"]:focus-visible,
nav .dd .sub a[href="hill-climb.html"].on{color:#00875A!important;background:#f4f4f4!important;}
nav .dd .sub a[href$="/baja.html"]:hover,
nav .dd .sub a[href$="/baja.html"]:focus-visible,
nav .dd .sub a[href$="/baja.html"].on,
nav .dd .sub a[href="baja.html"]:hover,
nav .dd .sub a[href="baja.html"]:focus-visible,
nav .dd .sub a[href="baja.html"].on{color:#BB945D!important;background:#f4f4f4!important;}
nav .dd .sub a[href$="/e-gaming.html"]:hover,
nav .dd .sub a[href$="/e-gaming.html"]:focus-visible,
nav .dd .sub a[href$="/e-gaming.html"].on,
nav .dd .sub a[href="e-gaming.html"]:hover,
nav .dd .sub a[href="e-gaming.html"]:focus-visible,
nav .dd .sub a[href="e-gaming.html"].on{color:#E8202E!important;background:#f4f4f4!important;}
</style>
<style id="stc-verified-item-hover">
nav .dd .sub a[data-stc-hover]{color:#111!important;}
nav .dd .sub a[data-stc-hover]:is(:hover,:focus-visible,.on){color:var(--stc-brand)!important;background:#f3f3f3!important;}
nav .dd .sub a[data-stc-hover]:is(:hover,:focus-visible,.on)::before{border-color:var(--stc-brand)!important;color:var(--stc-brand)!important;}
</style>
<script id="stc-verified-hover-script">
document.addEventListener('DOMContentLoaded',function(){
  const brands = {karting:'#E8202E',autocross:'#00875A','time-attack':'#E8202E',drift:'#E8202E','hill-climb':'#00875A',baja:'#BB945D','e-gaming':'#E8202E'};
  document.querySelectorAll('nav .dd .sub a').forEach(a=>{
    const slug = (a.getAttribute('href')||'').split('?')[0].split('/').pop().replace(/\.html$/,'');
    if(!brands[slug]) return;
    a.setAttribute('data-stc-hover',slug);
    a.style.setProperty('--stc-brand',brands[slug]);
    // Remove generic page-colored .on state from category links unless selected.
    const active=() => a.matches(':hover,:focus-visible') || a.classList.contains('on');
    const update=()=>{a.style.setProperty('color', active() ? brands[slug] : '#111','important');a.style.setProperty('background',active() ? '#f3f3f3' : 'transparent','important');};
    ['pointerenter','pointerleave','focus','blur'].forEach(event=>a.addEventListener(event,update));
    update();
  });
});
</script>
</head>
<body>
  <main id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <a class="brand" href="/">SAUDI <strong>TOYOTA</strong> CHAMPIONSHIP</a>
      <h1>Content dashboard</h1>
      <p>Log in to edit and publish site content.</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <main id="editor-screen" class="editor-screen" hidden>
    <header class="toolbar">
      <a class="brand" href="/">SAUDI <strong>TOYOTA</strong> CHAMPIONSHIP</a>
      <div class="mode-switch" role="tablist" aria-label="Dashboard section">
        <button type="button" role="tab" class="on" aria-selected="true" data-mode="pages">Pages</button>
        <button type="button" role="tab" aria-selected="false" data-mode="scores">Race Scores</button>
        <button type="button" role="tab" aria-selected="false" data-mode="live">Live Scores</button>
      </div>
      <div class="toolbar-actions">
        <label class="page-select-label" for="page-select">Page</label>
        <select id="page-select"></select>
        <button id="logout" class="quiet" type="button">Log out</button>
      </div>
    </header>
    <div class="editor-layout">
      <iframe id="page-preview" title="Page preview with editable content"></iframe>
      <aside id="edit-sidebar" class="edit-sidebar" aria-label="Edit selected content">
        <div class="sidebar-heading">
          <span class="eyebrow">CONTENT EDITOR</span>
          <h1>Edit page</h1>
          <p>Choose a pencil on the page to edit its text or image.</p>
        </div>
        <section id="selection-empty" class="selection-empty" aria-live="polite">
          Select a text block or image in the preview.
        </section>
        <section id="section-editor" class="selection-editor" hidden>
          <h2 id="section-title">Section content</h2>
          <div id="section-fields" class="section-fields"></div>
        </section>
        <div class="sidebar-footer">
          <span id="editor-status" role="status">Select an item to start editing.</span>
          <button id="save-page" class="primary" type="button" disabled>Save changes</button>
        </div>
      </aside>
    </div>

    <div id="scores-layout" class="scores-layout" data-manager="scores" hidden></div>
    <div id="live-layout" class="scores-layout" data-manager="live" hidden></div>
  </main>
</body>
</html>
